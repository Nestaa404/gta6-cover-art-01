<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Coast Cover Studio — GTA-style cover maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="studio">
  <aside class="editor" aria-label="Cover editor">
    <header class="masthead">
      <h1>Neon Coast <em>Cover Studio</em></h1>
      <p class="intro">Your photo plus a caption, turned into a multi-panel poster-style cover. Everything runs on your machine — photos are never uploaded.</p>
    </header>

    <section class="block">
      <h2>1 · Layout</h2>
      <div id="planRow" class="choices"></div>
    </section>

    <section class="block">
      <h2>2 · Photos — pick a panel, then a photo</h2>
      <div class="cell-tabs" role="tablist">
        <button type="button" data-cell="0" class="cell-tab on">Panel 1</button>
        <button type="button" data-cell="1" class="cell-tab">Panel 2</button>
        <button type="button" data-cell="2" class="cell-tab">Panel 3</button>
      </div>
      <div class="btn-row">
        <button id="usePier" type="button">Sample: Pier</button>
        <button id="useBoulevard" type="button">Sample: Boulevard</button>
      </div>
      <label class="field">Or your own photo
        <input id="photoFile" type="file" accept="image/*">
      </label>
      <div class="btn-row">
        <select id="fillChoice" aria-label="Sample to fill empty panels with">
          <option value="pier">Pier</option>
          <option value="boulevard">Boulevard</option>
        </select>
        <button id="fillEmpty" type="button">Fill empty panels</button>
      </div>
    </section>

    <section class="block">
      <h2>3 · Crop the selected panel</h2>
      <label class="field">Zoom <span id="zoomOut">100%</span>
        <input id="zoomRange" type="range" min="0.5" max="3" step="0.05" value="1">
      </label>
      <label class="field">Pan left–right <span id="panXOut">0</span>
        <input id="panXRange" type="range" min="-0.5" max="0.5" step="0.01" value="0">
      </label>
      <label class="field">Pan up–down <span id="panYOut">0</span>
        <input id="panYRange" type="range" min="-0.5" max="0.5" step="0.01" value="0">
      </label>
      <button id="cropReset" type="button">Reset crop</button>
    </section>

    <section class="block">
      <h2>4 · Colour grade</h2>
      <div id="toneRow" class="choices"></div>
    </section>

    <section class="block">
      <h2>5 · Words</h2>
      <div class="choices">
        <span class="preset-label">Presets:</span>
        <span id="presetRow" class="choices"></span>
      </div>
      <label class="field">Caption
        <input id="headlineInput" type="text" maxlength="40" value="Sunset Heist">
      </label>
      <label class="field">Sub-caption
        <input id="strapInput" type="text" maxlength="60" value="Neon Coast • A story in three frames">
      </label>
      <label class="field">City tag
        <input id="cityInput" type="text" maxlength="20" value="NEON COAST">
      </label>
    </section>

    <section class="block">
      <h2>6 · Export</h2>
      <div id="sizeRow" class="choices"></div>
      <button id="exportBtn" type="button" class="export-btn">Export PNG</button>
      <p id="note" role="status"></p>
    </section>
  </aside>

  <figure class="stage" aria-label="Cover preview">
    <canvas id="poster" width="1080" height="1080"></canvas>
    <figcaption class="caption">Preview — the exported PNG renders at full post size.</figcaption>
  </figure>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
